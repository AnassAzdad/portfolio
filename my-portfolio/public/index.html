<!DOCTYPE html>
<html lang="nl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0b14" />
    <meta
      name="description"
      content="Anass Azdad — frontend developer in opleiding bij het Mediacollege Amsterdam. React, TypeScript en interactieve webapps."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Zet het thema vóór de eerste render, zodat er geen flits van het verkeerde thema is.
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        var lang = localStorage.getItem("language");
        if (lang) document.documentElement.setAttribute("lang", lang);
      } catch (e) {}
    </script>
    <title>Anass Azdad — Frontend Developer</title>
  </head>
  <body>
    <noscript>Zet JavaScript aan om deze site te bekijken.</noscript>
    <div id="root"></div>
  </body>
</html>
